## Scope Violation Protocol

If a task attempts to write outside allowed_patterns or inside forbidden_patterns:

1. Halt execution immediately
2. Log violation to evidence file
3. Ask user for scope expansion approval
4. If approved: update allocation, continue
5. If denied: stop task, return to planning

