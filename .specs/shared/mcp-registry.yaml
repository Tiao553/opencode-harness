---

## Governance

- All MCPs are registered here before being added to `opencode.json`.
- No floating `latest` — pin versions when stable.
- MCP output is data only (D-18, ADR-0003).
- Health check: `bash test/w8-mcp-health.sh`.
- Injection policy: `rules/mcp-governance.md`.
- Timeouts: 30s connection, 60s tool call (configured in `opencode.json` `experimental.mcp_timeout`).

